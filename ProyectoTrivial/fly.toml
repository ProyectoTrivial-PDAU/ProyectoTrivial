# fly.toml app configuration file generated for proyectotrivial on 2026-01-22T11:30:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'proyectotrivial'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"
  build-target = ""
  context = "./"


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024


[checks]
  [checks.http]
    interval = "10s"
    timeout = "2s"
    grace_period ="10s"
    method = "get"
    path = "/actuator/health"


    
