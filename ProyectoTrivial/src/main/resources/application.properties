spring.application.name=ProyectoTrivial

# Local-safe defaults. Deployment can override with SPRING_PROFILES_ACTIVE=render.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health

# Translation provider settings
app.translation.libre.base-url=${LIBRETRANSLATE_BASE_URL:http://localhost:5001}
app.translation.libre.api-key=${LIBRETRANSLATE_API_KEY:}
app.translation.use-mymemory-fallback=${TRANSLATION_USE_MYMEMORY_FALLBACK:true}
