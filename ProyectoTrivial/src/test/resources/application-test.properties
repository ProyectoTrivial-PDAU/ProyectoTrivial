spring.application.name=ProyectoTrivial

# --- H2 en memoria para tests ---
spring.datasource.url=jdbc:h2:mem:proyectotrivial;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false

# Deshabilitar traduccion externa en tests
app.translation.libre.base-url=http://localhost:9999
app.translation.use-mymemory-fallback=false
