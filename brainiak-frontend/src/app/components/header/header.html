<div class="header">
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">
        <img src="assets/brainiak-icono-removebg.png" class="logo-img">
      </div>
      <span>Brainiak</span>
    </div>
    <div class="header-actions">
      <div class="profile-info" (click)="openProfile.emit()">
        <div class="profile-avatar">{{ avatar }}</div>
        <div class="profile-name">{{ displayName }}</div>
      </div>
    </div>
  </div>
</div>
