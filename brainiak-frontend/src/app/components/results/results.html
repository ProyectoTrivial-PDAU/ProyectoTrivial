<div class="results-screen">
  <h2 class="results-title">¡Juego Terminado!</h2>
  <div class="results-score">{{ score }}/{{ total }}</div>
  <div class="results-buttons">
    <button class="results-btn" (click)="restartGame()">Jugar de nuevo</button>
    <button class="results-btn" (click)="goHome()">Volver al inicio</button>
  </div>
</div>
