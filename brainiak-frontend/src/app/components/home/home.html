<div class="home-screen">
  <div class="welcome-section">
    <h1 class="welcome-title">¡Bienvenido a Brainiak!</h1>
    <p class="welcome-subtitle">Elige un modo de juego para comenzar con la partida.</p>
  </div>

  <div class="game-modes">
    <div class="game-mode-card mode-clasico" (click)="startRandomGame()">
      <div class="mode-icon">❓</div>
      <div class="mode-title">Clásico</div>
    </div>

    <div class="game-mode-card mode-tiempo" (click)="showCategorySelection()">
      <div class="mode-icon">⏱️</div>
      <div class="mode-title">Por Categoría</div>
    </div>
  </div>

  <div class="admin-section">
    <div class="admin-card" (click)="showRanking()">
      <svg class="admin-icon" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 3.5a1.5 1.5 0 013 0V4a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-.5a1.5 1.5 0 000 3h.5a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-.5a1.5 1.5 0 00-3 0v.5a1 1 0 01-1 1H6a1 1 0 01-1-1v-3a1 1 0 00-1-1h-.5a1.5 1.5 0 010-3H4a1 1 0 001-1V6a1 1 0 011-1h3a1 1 0 001-1v-.5z"/>
      </svg>
      <span>Ranking</span>
    </div>
    <div class="admin-card" (click)="showUserManagement()">
      <svg class="admin-icon" fill="currentColor" viewBox="0 0 20 20">
        <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
      </svg>
      <span>Gestión de Usuarios</span>
    </div>
  </div>
</div>
