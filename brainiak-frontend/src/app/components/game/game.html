<div class="game-screen" *ngIf="currentQuestion">
  <div class="game-header">
    <div class="game-info">
      <div>Pregunta: <span>{{ currentQuestionIndex + 1 }}</span>/<span>{{ questions.length }}</span></div>
      <div>Puntuación: <span>{{ score }}</span></div>
    </div>
    <button class="back-btn" (click)="goHome()">Volver</button>
  </div>

  <div class="question-card">
    <div class="question-number">{{ currentQuestion.categoria }}</div>
    <div class="question-text">{{ currentQuestion.pregunta }}</div>
    <div class="options-grid">
      @for (option of currentQuestion.opciones; track option) {
        <button 
          class="option-btn"
          [class.correct]="isCorrect(option)"
          [class.incorrect]="isIncorrect(option)"
          [disabled]="answered"
          (click)="selectAnswer(option)">
          {{ option }}
        </button>
      }
    </div>
  </div>
</div>

<div class="loading" *ngIf="!currentQuestion && questions.length === 0">
  <p>Cargando preguntas...</p>
</div>
