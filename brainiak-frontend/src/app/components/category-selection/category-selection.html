<div class="category-screen">
  <div class="welcome-section">
    <h1 class="welcome-title">Selecciona una Categoría</h1>
    <p class="welcome-subtitle">Elige la categoría de preguntas para tu partida.</p>
    <button class="auth-btn" (click)="goHome()">Volver</button>
  </div>

  <!-- Mensaje de carga -->
  <div class="loading-message" *ngIf="loading">
    <p>Cargando categorías...</p>
  </div>

  <!-- Grid de categorías -->
  <div class="categories-grid" *ngIf="!loading && categories.length > 0">
    <div class="category-card" 
         *ngFor="let category of categories; trackBy: trackCategory"
         (click)="selectCategory(category)">
      <div class="category-icon">{{ getIcon(category) }}</div>
      <div>{{ category }}</div>
    </div>
  </div>

  <!-- Mensaje si no hay categorías -->
  <div class="no-categories" *ngIf="!loading && categories.length === 0">
    <p>No hay categorías disponibles en este momento.</p>
    <button class="retry-btn" (click)="loadCategories()">Reintentar</button>
  </div>
</div>
