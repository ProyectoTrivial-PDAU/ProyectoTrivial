name: CI - Pruebas Automatizadas

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecucion al wrapper
        # Esto es vital para que GitHub pueda ejecutar ./mvnw
        run: chmod +x mvnw

      - name: Ejecutar todos los tests con Maven Wrapper
        # Usamos ./mvnw en lugar de mvn para asegurar compatibilidad
        working-directory: ./ProyectoTrivial  # Asegúrate de estar en el directorio raíz del proyecto
        run: ./mvnw test --batch-mode

      - name: Publicar resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: ProyectoTrivial/target/surefire-reports/